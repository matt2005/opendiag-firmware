name: Firmware and J2534 driver

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build reproducible ESP32-S3 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Test, build, and verify reproducibility
        run: |
          mkdir -p build/docker
          docker compose --progress plain run --rm --build -T firmware --verify

      - name: Verify firmware package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          verification_dir=$(mktemp -d)
          trap 'rm -rf -- "$verification_dir"' EXIT
          unzip build/docker/opendiag-firmware.zip -d "$verification_dir"
          (cd "$verification_dir" && sha256sum --check SHA256SUMS)
          python3 - "$verification_dir/manifest.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          version = json.loads(Path(sys.argv[1]).read_text())["version"]
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag and version != release_tag:
              raise SystemExit(f"Firmware version {version!r} does not match the release tag")
          PY

      - name: Upload firmware package
        uses: actions/upload-artifact@v7
        with:
          path: build/docker/opendiag-firmware.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  j2534-driver:
    name: Test and build Windows J2534 driver package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Test and build driver package
        run: |
          mkdir -p build/docker
          docker compose --progress plain run --rm --build -T j2534-driver

      - name: Verify driver package
        run: |
          verification_dir=$(mktemp -d)
          trap 'rm -rf -- "$verification_dir"' EXIT
          unzip build/docker/opendiag-j2534-driver.zip -d "$verification_dir"
          (cd "$verification_dir" && sha256sum --check SHA256SUMS)

      - name: Upload driver package
        uses: actions/upload-artifact@v7
        with:
          path: build/docker/opendiag-j2534-driver.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  # Line coverage gate: at least 95% for main/ (host suite) and for the host-testable
  # driver sources. Packages come from the Ubuntu 24.04 archive (unpinned, as the
  # runner image moves them); gcovr is pinned. The default gcc and gcov are used, which
  # are a matched pair on this image.
  coverage:
    name: Line coverage gate (95%)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build protobuf-compiler python3 python3-protobuf python3-venv
          python3 -m venv --system-site-packages "$RUNNER_TEMP/gcovr-venv"
          "$RUNNER_TEMP/gcovr-venv/bin/pip" install gcovr==8.3
          echo "$RUNNER_TEMP/gcovr-venv/bin" >> "$GITHUB_PATH"

      - name: Coverage of main/ (host suite)
        env:
          COVERAGE_FAIL_UNDER: "95"
        run: |
          gcov --version | head -n 1
          cmake -S test/host -B build/coverage-host -G Ninja -DCOVERAGE=ON
          cmake --build build/coverage-host
          ctest --test-dir build/coverage-host --output-on-failure
          # Reports main/ only and fails below COVERAGE_FAIL_UNDER; prints the total line coverage.
          cmake --build build/coverage-host --target coverage

      - name: Coverage of j2534_driver/ (driver, common, legacy, platform, config)
        run: |
          make -C j2534_driver test COVERAGE=1
          cd j2534_driver
          gcovr --root . --print-summary --fail-under-line 95 \
            --filter 'driver/' --filter 'common/' --filter 'legacy/' \
            --filter 'platform/' --filter 'config/' \
            build/linux/release

  release:
    name: Publish GitHub Release
    needs: [build, j2534-driver]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download verified firmware package
        uses: actions/download-artifact@v8
        with:
          name: opendiag-firmware.zip
          path: dist
          skip-decompress: true

      - name: Download verified driver package
        uses: actions/download-artifact@v8
        with:
          name: opendiag-j2534-driver.zip
          path: dist
          skip-decompress: true

      - name: Verify release packages
        run: |
          verification_dir=$(mktemp -d)
          trap 'rm -rf -- "$verification_dir"' EXIT
          for package in opendiag-firmware.zip opendiag-j2534-driver.zip; do
            unzip "dist/$package" -d "$verification_dir/$package"
            (cd "$verification_dir/$package" && sha256sum --check SHA256SUMS)
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/opendiag-firmware.zip \
            dist/opendiag-j2534-driver.zip \
            "${release_flags[@]}"

      # A release made with GITHUB_TOKEN does not trigger other workflows, so ask for the docs
      # rebuild explicitly. It runs on main, which the github-pages environment allows to deploy.
      - name: Republish the firmware update page
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main
