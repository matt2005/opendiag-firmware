name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main, dev]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  # Also dispatched by firmware.yml after a release, so the update page serves the new firmware.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install MkDocs
        # MkDocs 2.0 drops the plugin and theme system Material depends on.
        run: pip install "mkdocs<2" mkdocs-material mkdocs-github-admonitions-plugin

      # --strict turns broken links and missing files into failures, so a PR catches them.
      - name: Build
        run: mkdocs build --strict -d site

      # The web installer on update/ flashes whatever is in update/firmware/<board>/. Each release
      # ZIP's manifest.json is already in ESP Web Tools format, so every board's release ZIP is
      # unpacked as-is into its own folder.
      - name: Add latest firmware release to the update page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          packages_dir=$(mktemp -d)
          trap 'rm -rf -- "$packages_dir"' EXIT
          gh release download --pattern 'opendiag-firmware-*.zip' --dir "$packages_dir"
          shopt -s nullglob
          packages=("$packages_dir"/opendiag-firmware-*.zip)
          if (( ${#packages[@]} == 0 )); then
            echo "The latest release has no opendiag-firmware-<board>.zip" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            board=$(basename "$package" .zip)
            board=${board#opendiag-firmware-}
            mkdir -p "site/update/firmware/$board"
            unzip "$package" -d "site/update/firmware/$board"
            (cd "site/update/firmware/$board" && sha256sum --check SHA256SUMS)
          done

      # boards.json is the board list the update page offers. It must match the boards in the
      # checkout and the ZIPs just unpacked, so a board missing from either side fails the build.
      # "default" comes from each board.json, and exactly one board must set it. The default entry
      # is listed first, then the rest in board id order. The update page starts on the first entry.
      - name: Write the update page board list
        run: |
          python3 -I - site/update/firmware <<'PY'
          import json
          import sys
          from pathlib import Path
          firmware = Path(sys.argv[1])
          published = {path.name for path in firmware.iterdir() if path.is_dir()}
          boards = {
              path.parent.name: json.loads(path.read_text())
              for path in Path("boards").glob("*/board.json")
          }
          without_zip = sorted(set(boards) - published)
          without_board = sorted(published - set(boards))
          if without_zip or without_board:
              raise SystemExit(
                  f"Boards without a release ZIP: {without_zip}; "
                  f"release ZIPs without a board: {without_board}"
              )
          defaults = sorted(board for board, info in boards.items() if info["default"] is True)
          if len(defaults) != 1:
              raise SystemExit(f"Exactly one board.json must have \"default\": true, found {defaults}")
          entries = [
              {
                  "name": info["name"],
                  "default": info["default"],
                  "manifest": f"firmware/{board}/manifest.json",
              }
              for board, info in sorted(boards.items(), key=lambda item: (not item[1]["default"], item[0]))
          ]
          (firmware / "boards.json").write_text(json.dumps(entries, indent=2) + "\n")
          PY

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
